[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inverter-monitor"
version = "0.1.0"
description = "Read-only live monitor for Cascadia/Rinehart PM100DX inverters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyside6-essentials>=6.6",
    "pyqtgraph>=0.13",
    "python-can>=4.3",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
inverter-monitor = "inverter_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
