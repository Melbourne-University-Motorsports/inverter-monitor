- name: EEPROM_Parameter_Message
  transport: CAN
  direction: command
  can_id_hex: null
  can_id_decimal: null
  pages:
  - 25
  - 47
  notes:
  - EEPROM parameters may be programmed via RMS GUI or CAN Parameter message.
  - Appendix C defers all CAN configuration to separate CAN Protocol document.
  signals:
  - name: Inv_Cmd_Mode_EEPROM
    gui_address: '0x011B'
    value_range: 0 or 1
    description: 0=CAN bus control; 1=VSM mode (accelerator/switches).
  - name: Discharge_Enable_EEPROM
    gui_address: '0x016D'
    value_range: 0, 1, 2
    description: 0=disabled; 1=enabled without faults; 2=enabled with faults.
  - name: Clear Faults Command
    value_range: '0'
    description: Set to 0 to clear faults (symbol name only; GUI address not in this manual).
