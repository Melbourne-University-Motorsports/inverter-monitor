- name: SCI_Broadcast_Records
  transport: RS232 SCI
  direction: status
  can_id_hex: null
  can_id_decimal: null
  endianness: null
  cycle_time_ms: null
  pages:
  - 18
  - 19
  notes:
  - 57600 baud, 8N1, no flow control.
  - Each record is 16-bit; four ASCII nibbles plus space; CRLF after full set.
  - Update rate depends on record count and processor availability.
  signals:
  - name: Power_On_Timer_Lo
    sci_record: 1
    description: The low word of the Power On Timer (increments every 3 ms)
    unit: null
    multiplier: 1
    raw_to_physical: physical = raw
  - name: Filtered_Accel_Pot
    sci_record: 2
    description: Filtered Accel-pot input voltage (V) times 100
    unit: V
    multiplier: 100
    raw_to_physical: physical = raw / 100
  - name: Motor_Torque_Feedback
    sci_record: 3
    description: Motor Torque feedback (Nm) times 10
    unit: N.m
    multiplier: 10
    raw_to_physical: physical = raw / 10
  - name: Vehicle_Torque_Command
    sci_record: 4
    description: Vehicle Torque Command (Nm) times 10
    unit: N.m
    multiplier: 10
    raw_to_physical: physical = raw / 10
  - name: DC_Voltage
    sci_record: 5
    description: DC Voltage (V) times 10
    unit: V
    multiplier: 10
    raw_to_physical: physical = raw / 10
  - name: DC_Current
    sci_record: 6
    description: DC Current (A) times 10
    unit: A
    multiplier: 10
    raw_to_physical: physical = raw / 10
  - name: Motor_Speed
    sci_record: 7
    description: Motor Speed (rpm)
    unit: rpm
    multiplier: 1
    raw_to_physical: physical = raw
  - name: Flux_Weakening_Regulator_Output
    sci_record: 8
    description: Flux Weakening Regulator Output (Apk) times 10
    unit: Apk
    multiplier: 10
    raw_to_physical: physical = raw / 10
  - name: Motor_Voltage_Magnitude
    sci_record: 9
    description: Motor Voltage Magnitude (Vpk) times 10
    unit: Vpk
    multiplier: 10
    raw_to_physical: physical = raw / 10
  - name: IQ_Command
    sci_record: 10
    description: IQ Command (Apk) times 10
    unit: Apk
    multiplier: 10
    raw_to_physical: physical = raw / 10
  - name: IQ_Feedback
    sci_record: 11
    description: IQ Feedback (Apk) times 10
    unit: Apk
    multiplier: 10
    raw_to_physical: physical = raw / 10
  - name: ID_Command
    sci_record: 12
    description: ID Command (Apk) times 10
    unit: Apk
    multiplier: 10
    raw_to_physical: physical = raw / 10
  - name: ID_Feedback
    sci_record: 13
    description: ID Feedback (Apk) times 10
    unit: Apk
    multiplier: 10
    raw_to_physical: physical = raw / 10
  - name: Modulation
    sci_record: 14
    description: Modulation times 10000
    unit: null
    multiplier: 10000
    raw_to_physical: physical = raw / 10000
  - name: Module_A_Temperature
    sci_record: 15
    description: Module A Temperature (°C) times 10
    unit: °C
    multiplier: 10
    raw_to_physical: physical = raw / 10
  - name: Motor_Temperature
