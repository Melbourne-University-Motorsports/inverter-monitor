protocol_gaps:
- CAN message IDs, broadcast cycle times, and signal start-bit layouts are not in this manual.
- 'Refer to external document: CAN Protocol.'
- Appendix C (CAN Configuration Parameters) contains no parameter table in revision 3.6.
data_formats:
  Temperature:
    variable_type: Signed Integer
    range: ±3000.0
    unit: °C
    multiplier: 10
  Low Voltage:
    variable_type: Signed Integer
    range: ±300.00
    unit: Volts
    multiplier: 100
  High Voltage:
    variable_type: Signed Integer
    range: ±3000.0
    unit: Volts
    multiplier: 10
  Torque:
    variable_type: Signed Integer
    range: ±3000.0
    unit: N.m.
    multiplier: 10
  Current:
    variable_type: Signed Integer
    range: ±3000.0
    unit: Amps
    multiplier: 10
  Angle:
    variable_type: Signed Integer
    range: 0 to ±359.9
    unit: Degrees
    multiplier: 10
  Angular Velocity:
    variable_type: Signed Integer
    range: ±30000
    unit: RPM
    multiplier: 1
messages:
- name: Fault_Word
  transport: CAN
  direction: status
  can_id_hex: '0x0AB'
  can_id_decimal: 171
  message: M171_Fault_Codes
  endianness: little
  cycle_time_ms: 100
  id_source: rms_pm_dbc_20210505
  pages:
  - 33
  - 37
  - 38
  notes:
  - Manual maps POST faults to CAN bytes 0–3 and RUN faults to bytes 4–7.
  - CAN message ID, start bit layout, and endianness not specified in this manual; see separate CAN Protocol document.
  signals:
  - name: Hardware Gate/Desaturation Fault
    can_byte: 0
    can_bit: 0
    bit_number: 0
    length_bits: 1
    severity: fault
    fault_word_value: '00000001'
  - name: HW Over-current Fault
    can_byte: 0
    can_bit: 1
    bit_number: 1
