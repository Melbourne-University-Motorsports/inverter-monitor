reporting:
  transport: Fault bits mapped to CAN bytes 0–7 in a fault word; CAN message ID not specified in this manual.
  legacy_symbols_removed:
  - post_fault_hi
  - post_fault_lo
  - run_fault_hi
  - run_fault_lo
  gui_access: Check Faults button on RMS GUI Memory View page.
  clear_command:
    name: Clear Faults Command
    value_to_clear: 0
    clears: All active faults including POST faults except EEPROM Update Required.
    can_mode_note: Inverter must be disabled before sending Clear Faults Command in CAN mode.
  fault_indicator_priority: POST faults (higher) then RUN faults (lower); POST followed by two quick blinks.
registers:
- name: POST_Fault_Word
  can_bytes:
  - 0
  - 1
  - 2
  - 3
  bits:
  - can_byte: 0
    can_bit: 0
    bit_number: 0
    name: Hardware Gate/Desaturation Fault
    fault_word_value: '00000001'
    severity: fault
  - can_byte: 0
    can_bit: 1
    bit_number: 1
    name: HW Over-current Fault
    fault_word_value: '00000002'
    severity: fault
  - can_byte: 0
    can_bit: 2
    bit_number: 2
    name: Accelerator input shorted to ground
    fault_word_value: '00000004'
    severity: fault
  - can_byte: 0
    can_bit: 3
    bit_number: 3
    name: Accelerator input open or shorted to 5V
    fault_word_value: 00000008
    severity: fault
  - can_byte: 0
    can_bit: 4
    bit_number: 4
    name: Current Sensor Low
    fault_word_value: '00000010'
    severity: fault
  - can_byte: 0
    can_bit: 5
    bit_number: 5
    name: Current Sensor High
    fault_word_value: '00000020'
    severity: fault
  - can_byte: 0
    can_bit: 6
    bit_number: 6
    name: Module Temperature Low
    fault_word_value: '00000040'
    severity: fault
  - can_byte: 0
    can_bit: 7
    bit_number: 7
    name: Module Temperature High
    fault_word_value: 00000080
    severity: fault
  - can_byte: 1
    can_bit: 8
    bit_number: 8
    name: Control PCB Temperature Low
    fault_word_value: '00000100'
    severity: fault
  - can_byte: 1
    can_bit: 9
    bit_number: 9
    name: Control PCB Temperature High
    fault_word_value: '00000200'
    severity: fault
  - can_byte: 1
    can_bit: 10
    bit_number: 10
    name: Gate Drive PCB Temperature Low
    fault_word_value: '00000400'
    severity: fault
  - can_byte: 1
    can_bit: 11
    bit_number: 11
    name: Gate Drive PCB Temperature High
    fault_word_value: 00000800
    severity: fault
  - can_byte: 1
    can_bit: 12
    bit_number: 12
    name: 5V Sense Voltage Low
    fault_word_value: '00001000'
    severity: fault
  - can_byte: 1
    can_bit: 13
    bit_number: 13
    name: 5V Sense Voltage High
    fault_word_value: '00002000'
    severity: fault
  - can_byte: 1
    can_bit: 14
    bit_number: 14
    name: 12V Sense Voltage Low
    fault_word_value: '00004000'
    severity: fault
  - can_byte: 1
    can_bit: 15
    bit_number: 15
    name: 12V Sense Voltage High
    fault_word_value: 00008000
    severity: fault
  - can_byte: 2
    can_bit: 16
    bit_number: 16
    name: Internal 2.5V Reference Voltage Low
    fault_word_value: '00010000'
    severity: fault
  - can_byte: 2
    can_bit: 17
    bit_number: 17
    name: Internal 2.5V Reference Voltage High
    fault_word_value: '00020000'
    severity: fault
  - can_byte: 2
    can_bit: 18
    bit_number: 18
    name: Internal 1.5V Reference Voltage Low
    fault_word_value: '00040000'
    severity: fault
  - can_byte: 2
    can_bit: 19
    bit_number: 19
    name: Internal 1.5V Sense Voltage High
    fault_word_value: 00080000
    severity: fault
  - can_byte: 2
    can_bit: 20
    bit_number: 20
    name: DC Bus Voltage High
    fault_word_value: '00100000'
    severity: fault
  - can_byte: 2
    can_bit: 21
    bit_number: 21
    name: DC Bus Voltage Low
    fault_word_value: '00200000'
    severity: fault
  - can_byte: 2
    can_bit: 22
    bit_number: 22
    name: Pre-charge Timeout
    fault_word_value: '00400000'
    severity: fault
  - can_byte: 2
    can_bit: 23
    bit_number: 23
    name: Pre-charge Voltage Failure
    fault_word_value: 00800000
    severity: fault
  - can_byte: 3
    can_bit: 24
    bit_number: 24
    name: EEPROM Checksum Invalid
    fault_word_value: '01000000'
    severity: fault
  - can_byte: 3
    can_bit: 25
    bit_number: 25
