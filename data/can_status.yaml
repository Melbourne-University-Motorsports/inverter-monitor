manual_version: V6.3
source_pdf: docs/Source Documentation/CAN Protocol (V6_3).pdf
pages:
- 10
- 11
- 12
- 13
sections:
- '§1.2 CAN Diagnostic Parameters Overview (Gen 3 only) — pp. 10–13'
- '§1.3 CAN Diagnostic Parameters Overview (Gen 5/CM only) — p. 13'
# The bench inverter is Gen 3 (defsyms_20221118_G3, ID_Bits = 2). §1.2 lists the
# two shadow registers below with full bit maps; §1.3 covers the same subjects as
# separate GUI watch items on Gen 5/CM and is NOT the map for this hardware.
applies_to: Gen 3 inverters
overview: >-
  Two shadow registers of the microcontroller CAN module are readable over RS232 Memory View.
  CAN_Status mirrors the live status register, updated every 3 ms. CAN_Faults mirrors the fault
  register and is sticky — once a bit sets it stays visible in the GUI until Clear Faults is sent.
  Both are polled as ordinary symbols (rm0x00C8, rm0x00C9); they are not CAN broadcasts.

registers:
- name: CAN_Status
  symbol: MemoryView.CAN_Status
  address: 0x00C8
  width_bits: 16
  display: hex
  live: true
  notes: Live shadow of the CAN module status register, refreshed every 3 ms.
  bits:
  - mask: 0x0001
    name: Transmit Mode
    severity: info
    description: >-
      CAN module is transmitting a message (1) or is idle (0). Reflects what the module is doing
      regardless of mailbox configuration — normal traffic, not a problem.
  - mask: 0x0002
    name: Receive Mode
    severity: info
    description: >-
      CAN module is receiving a message (1) or is idle (0). Normal traffic, not a problem.
  - mask: 0x0004
    name: Power Down Acknowledge
    severity: info
    description: 1 while the CAN module has entered power-down mode; 0 in normal operation.
  - mask: 0x0008
    name: Change Configuration Enable
    severity: info
    description: >-
      Set after a one-clock latency when the CPU holds write access to the CAN configuration
      registers. Configuration plumbing, not bus health.
  - mask: 0x0010
    name: Suspend Mode Acknowledge
    severity: info
    description: >-
      Set one clock up to one frame after suspend mode was activated with a debugger tool.
      Only appears on a debugger attach, not on the car.
  - mask: 0x0020
    name: Error Warning
    severity: warning
    description: >-
      One of the two error counters (CANRx / CANTx) has reached the warning level of 96.
      Both counters below 96 clears the bit. First sign of bus trouble — check cabling,
      termination and bit rate before it escalates.
  - mask: 0x0040
    name: Error Passive
    severity: warning
    description: >-
      CAN module is in error-passive mode: the transmit error counter has reached 128. The node
      stops sending error frames and goes quiet on the bus until it recovers.
  - mask: 0x0080
    name: Bus Off
    severity: fault
    description: >-
      CAN module is in bus-off state — an abnormal rate of errors; the transmit error counter
      reached 256. No messages can be received or transmitted. Auto bus-on is enabled on this
      firmware, so the controller re-starts by itself after 128 × 11 recessive bits; the error
      counters are cleared once it leaves bus-off.

- name: CAN_Faults
  symbol: MemoryView.CAN_Faults
  address: 0x00C9
  width_bits: 16
  display: hex
  live: true
  sticky: true
  notes: >-
    Sticky shadow of the CAN fault register: a bit that has ever set stays readable through the
    GUI until Clear Faults is sent (Clear Faults Command, RAM 0x0002 = 0 — the same button as
    POST/RUN faults). A latched bit here does not stop the bus by itself.
  bits:
  - mask: 0x0001
    name: Acknowledge Error
    severity: warning
    description: The CAN module received no acknowledge — nothing on the bus acknowledged the frame.
  - mask: 0x0002
    name: Stuff Error
    severity: warning
    description: A stuff bit error occurred (more than five identical bits in a row on the bus).
  - mask: 0x0004
    name: CRC Error
    severity: warning
    description: The CAN module received a frame with a wrong CRC.
  - mask: 0x0008
    name: Stuck At Dominant 1
    severity: info
    description: >-
      Always 1 after a hardware/software reset or a bus-off condition, cleared as soon as a
      recessive bit is seen on the bus. Set on every power-up before traffic arrives, so on its
      own it does not raise the CAN flag — read it together with the other bits.
  - mask: 0x0010
    name: Bit Error
    severity: warning
    description: >-
      A received bit did not match the transmitted bit outside the arbitration field, or a
      dominant bit was sent while a recessive bit arrived during arbitration.
  - mask: 0x0020
    name: Form Error
    severity: warning
    description: >-
      One of the fixed-form bit fields carried the wrong level on the bus; the module could not
      send or receive that frame correctly.

counters:
- name: CAN_Tx_Error_Counter
  symbol: MemoryView.CAN_Tx_Error_Counter
  address: 0x00CC
  width_bits: 16
  max: 255
  warn_at: 96
  description: >-
    Count of errors while sending CAN messages. Wraps back to 0 after 255. Below 96 is normal;
    96 is the module's own warning level; 128 puts the node error-passive (0x0040) and 256 is
    bus-off (0x0080).
- name: CAN_Rx_Error_Counter
  symbol: MemoryView.CAN_Rx_Error_Counter
  address: 0x00CD
  width_bits: 16
  max: 127
  warn_at: 96
  description: >-
    Count of errors while receiving CAN messages; maximum 127. Counts back down towards 0 for
    every correctly received message, so a healthy bus keeps it near 0.
- name: CAN_Tx_Error_Counter_(Max)
  symbol: MemoryView.CAN_Tx_Error_Counter_(Max)
  address: 0x008B
  width_bits: 16
  max: 255
  warn_at: 96
  description: >-
    Highest transmit error count seen. Useful as a post-run witness: a peak above 96 means the
    bus was struggling even if the live counter has since recovered.

health:
  note: What the monitor turns the words above into. Severity, not raw bits, drives the flag.
  source_keys:
    status: MemoryView.CAN_Status
    faults: MemoryView.CAN_Faults
    tx: MemoryView.CAN_Tx_Error_Counter
    rx: MemoryView.CAN_Rx_Error_Counter
  rules:
  - level: fault
    when: CAN_Status bit 0x0080 (Bus Off) is set
    label: CAN bus off
  - level: warning
    when: >-
      CAN_Status bit 0x0020 (Error Warning) or 0x0040 (Error Passive) is set, or any warning bit
      of CAN_Faults is set, or the Tx/Rx error counter has reached 96
    label: CAN degraded
  - level: ok
    when: Both words read 0 and both counters are below 96
    label: CAN OK
  - level: unknown
    when: No fresh CAN_Status / CAN_Faults reading for the current source
    label: CAN —
  ignored: Stuck At Dominant 1 (0x0008) is set on power-up and on every reset, so it never raises the flag on its own.

gen5_only_watch_items:
  note: >-
    §1.3 lists these as separate RMS GUI watch items on Gen 5/CM controllers. They are not the
    Gen 3 register map above and are not polled by this monitor.
  items:
  - CAN_Status_Bus_Off
  - CAN_Status_Error_Passive
  - CAN_Status_Error_Warning
  - CAN_Status_Last_Error_Code
  - CAN_Tx_Error_Counter
  - CAN_Rx_Error_Counter

undocumented_symbols:
- name: CANES_Low
  address: 0x00CA
  note: In the G3 defsyms next to the CAN block; no bit map in the CAN Protocol or Software User Manual. Not decoded.
- name: CANES_High
  address: 0x00CB
  note: Same as CANES_Low — name suggests a CAN error-status pair, but the documents do not describe it.

conflicts:
- CAN Protocol p. 12 prints "The shadow faults can be cleared by setting Clear Fault Command to 04".
  The trailing 4 is the page's footnote marker; Software User Manual §11.6.2 and the monitor's
  Clear Faults path both set Clear Faults Command (0x0002) to 0.
