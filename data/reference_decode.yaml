conflicts:
  - id: m170_vsm_bit_position
    summary: "M170 VSM state bit start differs between mur-embedded reconstruction and official RMS DBC"
    official:
      source: rms_pm_dbc_20210505
      signal: D1_VSM_State
      start_bit: 0
      len: 8
    reconstructed:
      source: mur_cascadia_reconstructed
      signal: INV_VSMState
      start_bit: 56
      len: 8
    resolution: "Use RMS DBC layout for PM100DX monitor"

  - id: discharge_state_enum
    summary: "20210505 PM DBC documents discharge states 0-4; Gen5/iM DBC adds 5-7"
    resolution: "Support 0-7 when parsing M170; label 5-7 only if firmware matches Gen5+"

  - id: m170_extra_limit_flags
    summary: "Gen5 20240129 DBC adds INV_Limit_Hot_Spot, INV_Limit_Coolant_Derating, INV_Limit_Stall_Burst_Model, etc. on M170"
    absent_from: rms_pm_dbc_20210505
    resolution: "Merge from Gen5 DBC if firmware is 204F-era Gen3/G3 hardware with updated CM card"

  - id: can_id_layout
    summary: "Same signal layout appears at decimal IDs 160-176 OR J1939 extended IDs (e.g. 2365565441 for M170)"
    resolution: "Configure transport profile: standard_11bit vs j1939_extended vs offset from EEPROM"

  - id: pm100dx_brake_column
    summary: "main.py uses column 18 for both Torque_Shudder and Brake"
    resolution: "Confirm RealTerm column order against defsyms; fix in new monitor"
