enums:
  INV_VSM_State:
    source: rms_pm_dbc_20210505
    catalog: data/vsm_states.yaml
    width_bits: 8
    values:
      0: { name: VSM_Start, description: "Default state at vehicle power-up." }
      1: { name: Precharge_Init, description: "Turn on the pre-charge relay." }
      2: { name: Precharge_Active, description: "Waiting for capacitor to finish charging." }
      3: { name: Precharge_Complete, description: "Completes final checks before proceeding to Wait State." }
      4: { name: VSM_Wait, description: "Waiting for activation of forward or reverse." }
      5: { name: VSM_Ready, description: "Activates the inverter state machine to begin energizing the motor." }
      6: { name: Motor_Running, description: "Normal motor running operation." }
      7: { name: Blink_Fault_Code, description: "The controller has faulted." }
      14: { name: Shutdown_KeySwitch_Mode1, description: "Inverter shutdown in process." }
      15: { name: Reset_Inverter, description: "Power must be recycled after EEPROM programming." }

  INV_Inverter_State:
    source: rms_pm_dbc_20210505
    catalog: data/vsm_states.yaml
    notes: "DBC labels 4–7 and 10–12 as Internal_State; names below are from Software User Manual V3.6 Inverter_Mode."
    values:
      0: { name: Power_up, description: "Precharge, power-up state" }
      1: { name: Stop, description: "Inverter not running; STOP state." }
      2: { name: Open_Loop, description: "For testing purposes." }
      3: { name: Closed_Loop, description: "Normal state." }
      4: { name: Start_Time_Delay, description: "Small delay before starting the inverter." }
      5: { name: Current_Sensor_Test, description: "Flux ramp and flux regulators enabled." }
      6: { name: Closed_Loop_Torque, description: "Torque regulator enabled." }
      7: { name: Torque_Ramp, description: "Start torque ramp." }
      8: { name: Idle_Run, description: "Inverter running normally." }
      9: { name: Idle_Stop, description: "Inverter stopped." }
      10: { name: Ramp_Off_Torque, description: "Ramps down torque command." }
      11: { name: Ramp_Off_Flux, description: "Ramps down flux command." }
      12: { name: All_Ramps_Off, description: "Shutoff inverter." }
      15: { name: Default_Stop, description: "Default – Stop state" }

  INV_Inverter_Discharge_State:
    source: rms_pm_dbc_20210505
    conflict: "Gen5/iM DBC adds VAL_ entries 5-7; 20210505 PM DBC CM text stops at 4"
    values:
      0: Disabled
      1: Enabled
      2: Speed_Check
      3: Active
      4: Complete
      5: { name: Error, source: rms_gen5_dbc_20240129, conflict: true }
      6: { name: Override, source: rms_gen5_dbc_20240129, conflict: true }
      7: { name: Timeout, source: rms_gen5_dbc_20240129, conflict: true }

  INV_Inverter_Run_Mode:
    source: rms_pm_dbc_20210505
    values:
      0: Torque_Mode
      1: Speed_Mode

  INV_Inverter_Command_Mode:
    source: rms_pm_dbc_20210505
    values:
      0: CAN_mode
      1: VSM_mode

  M192_Inverter_Enable:
    source: rms_pm_dbc_20210505
    values:
      0: "Turn the inverter OFF"
      1: "Turn the Inverter ON"

  M192_Direction_Command:
    source: rms_pm_dbc_20210505
    values:
      0: CW
      1: CCW

# Serial RealTerm log columns (PM100DX_Dashboard capture.txt format)
serial_capture_columns:
  source: pm100dx_main
  format: "space-separated uppercase hex, 20 fields per row"
  skip_header_lines: 3
  signed_16bit_norm:
    description: "If raw > 32766/scale, subtract 65535/scale"
    applies_to: [Torque_Feedback, Motor_Speed, IQ_Command, IQ_Feedback, ID_Command, ID_Feedback]
  columns:
    - { index: 0, name: Power_On_Lo_Word, scale: 0.333333, unit: ms, notes: "timer/3 per main.py" }
    - { index: 1, name: Accel, scale: 0.01, unit: V }
    - { index: 2, name: Torque_Feedback, scale: 0.1, unit: Nm, signed: true }
    - { index: 3, name: Torque_Command, scale: 0.1, unit: Nm, signed: true }
    - { index: 4, name: DC_Voltage, scale: 0.1, unit: V }
    - { index: 5, name: DC_Current, scale: 0.1, unit: A }
    - { index: 6, name: Motor_Speed, scale: 1, unit: rpm, signed: true }
    - { index: 7, name: Flux_Weakening, scale: 0.1, unit: A }
    - { index: 8, name: Motor_Voltage, scale: 0.1, unit: Vpk }
    - { index: 9, name: IQ_Command, scale: 0.1, unit: Apk, signed: true }
    - { index: 10, name: IQ_Feedback, scale: 0.1, unit: Apk, signed: true }
    - { index: 11, name: ID_Command, scale: 0.1, unit: Apk, signed: true }
    - { index: 12, name: ID_Feedback, scale: 0.1, unit: Apk, signed: true }
    - { index: 13, name: Modulation, scale: 0.0001, unit: "" }
    - { index: 14, name: Module_Temp, scale: 0.1, unit: degC }
    - { index: 15, name: Motor_Temp, scale: 0.1, unit: degC }
    - { index: 16, name: Run_Lo, type: fault_word }
    - { index: 17, name: Run_Hi, type: fault_word }
    - { index: 18, name: Torque_Shudder, scale: 0.1, unit: Nm, conflict: "main.py also uses index 18 for Brake at /100 — bug" }

# RMS GUI Memory View addresses (defsyms). Not SCI broadcast columns and not CAN payloads.
serial_parameters:
  source: rms_defsyms_g3
  catalog: data/defsyms.yaml
  protocol: rms_gui_rs232
  protocol_notes: docs/rms-gui-memory-view.md
  captures: [yuh.pcapng, yuh2.pcapng, yuh3.pcapng]
  framing:
    read: "rmAAAACC\\r"
    read_reply: "*AAAA=VVVVCC\\n\\r"
    write: "wmAAAA=VVVVCC\\r"
    write_reply: RAE
    checksum: "(-sum(ascii(prefix))) & 0xFF as 2 hex digits"
  watch_list: "No subscribe opcode. Add = extra rm in the round-robin; remove = stop polling that address (yuh2: Sin_corr added then dropped; VSM/enable/torques stayed)."
  default_poll: [0x0050, 0x0058, 0x0057, 0x005A, 0x0059]
  writes_implemented: false
  glance:
    - { name: VSM_State, address: 0x0093, type: uint }
    - { name: Inverter_Mode, address: 0x0092, type: uint }
    - { name: Inverter_Enable, address: 0x0094, type: uint }
    - { name: Vehicle_Direction, address: 0x0095, type: int }
    - { name: Feedback_Speed_RPM, address: 0x0097, type: int }
    - { name: Commanded_Torque_Nm_x10, address: 0x0098, type: int }
    - { name: Feedback_Torque_Nm_x10, address: 0x0099, type: int }
    - { name: V_DC_Filtered_Volts_x10, address: 0x00AD, type: int }
    - { name: I_DC_Filtered_Amps_x10, address: 0x00AF, type: int }
    - { name: Inverter_Discharge_State, address: 0x0087, type: hex }
