# EEPROM CAN configuration (RMS GUI parameter space — affects on-bus IDs)
# gui_group 8 in defsyms is the CAN page, not a numeric default for CAN_ID_Offset.
# Captured EEPROM 0x011D on this inverter is 0x00A0; the monitor defaults --id-offset to that.
eeprom_can_config:
  - { name: CAN_ID_Offset_EEPROM, address: 0x011D, type: uint, display: hex, gui_group: 8, source: rms_defsyms_g3 }
  - { name: CAN_Extended_Msg_ID_EEPROM, address: 0x0131, type: uint, gui_group: 8, source: rms_defsyms_g3 }
  - { name: CAN_J1939_Option_Active_EEPROM, address: 0x0132, type: uint, gui_group: 8, source: rms_defsyms_g3 }
  - { name: CAN_OBD2_Enable_EEPROM, address: 0x0152, type: uint, gui_group: 8, source: rms_defsyms_g3 }
  - { name: CAN_BMS_Limit_Enable_EEPROM, address: 0x017F, type: uint, gui_group: 8, source: rms_defsyms_g3 }
  - { name: CAN_Term_Res_Present_EEPROM, address: 0x011E, type: uint, gui_group: 8, source: rms_defsyms_g3 }
  - { name: CAN_Command_Message_Active_EEPROM, address: 0x011F, type: uint, gui_group: 8, source: rms_defsyms_g3 }
  - { name: CAN_Bit_Rate_EEPROM_kbps, address: 0x0120, type: uint, gui_group: 8, source: rms_defsyms_g3 }
  - { name: CAN_ACTIVE_MSGS_EEPROM_Lo_Word, address: 0x0129, type: uint, display: hex, gui_group: 8, source: rms_defsyms_g3 }
  - { name: CAN_ACTIVE_MSGS_EEPROM_Hi_Word, address: 0x012A, type: uint, display: hex, gui_group: 8, source: rms_defsyms_g3, notes: "Set hi word to 0xFFFE to enable M176; 0xFFFF disables" }
  - { name: CAN_Fast_Msg_Rate_EEPROM_ms, address: 0x0180, type: uint, gui_group: 8, source: rms_defsyms_g3 }
  - { name: CAN_Slow_Msg_Rate_EEPROM_ms, address: 0x0181, type: uint, gui_group: 8, source: rms_defsyms_g3 }
  - { name: CAN_Diag_Data_Tx_Active_EEPROM, address: 0x0160, type: uint, gui_group: 8, source: rms_defsyms_g3 }
  - { name: Inv_Cmd_Mode_EEPROM, address: 0x011B, type: uint, gui_group: 1, source: rms_defsyms_g3, notes: "0=CAN, 1=VSM" }

